name: Release firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Marlin-2.1.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('Marlin-2.1.2.1/platformio.ini', 'Marlin-2.1.2.1/ini/**') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e STM32F103RE_creality

      - name: Rename firmware to release asset
        id: asset
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC=$(ls .pio/build/STM32F103RE_creality/firmware-*.bin | head -1)
          OUT="ender3clay-${TAG}.bin"
          cp "$SRC" "$OUT"
          echo "path=Marlin-2.1.2.1/${OUT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.asset.outputs.tag }}" \
            "${{ github.workspace }}/${{ steps.asset.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.asset.outputs.tag }}" \
            --generate-notes
